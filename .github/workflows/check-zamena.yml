name: Check zamena

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-zamena
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "MODE=manual" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" == "0 5 * * *" ]; then
            echo "MODE=daily" >> $GITHUB_ENV
          else
            echo "MODE=check" >> $GITHUB_ENV
          fi

      - name: Run check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP_NAME: "КС-3-1"
        run: python check_zamena.py

      - name: Save hash state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Обновление хэша последнего PDF"
          file_pattern: last_hash.txt
