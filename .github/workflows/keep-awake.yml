name: Keep bot awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Render
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://zamena-bot.onrender.com/ || true)
            echo "Попытка $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done

      - name: Heartbeat (раз в сутки — чтобы GitHub не отключил расписание после 60 дней простоя)
        run: |
          date -u +%F > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          if ! git diff --cached --quiet; then
            git commit -m "heartbeat $(date -u +%F)"
            for i in 1 2 3; do
              git push && break || (git pull --rebase && sleep 3)
            done
          fi
